<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psilia Edge — Recording</title>
  <script src="/vendor/roslib.min.js"></script>
  <script src="/api/js/config.js"></script>
  <link rel="stylesheet" href="/psilia.css">
  <style>
    #preview-img {
      width: 100%;
      image-rendering: pixelated;
      border-radius: var(--radius-sm);
      display: block;
      margin-top: var(--space-md);
    }
    #preview-placeholder {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-idle);
      margin-top: var(--space-sm);
    }
    .cc__field {
      margin-top: var(--space-md);
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar__brand-row">
      <div class="brand">
        <span class="brand__psilia">Psilia</span>
        <span class="brand__edge">Edge</span>
      </div>
      <div class="di">
        <div class="di__dot" id="di-dot"></div>
        <span id="di-hostname"></span>
      </div>
    </div>
    <nav class="topbar__nav">
      <a href="/"               class="topbar__nav-item">home</a>
      <a href="/recording.html" class="topbar__nav-item topbar__nav-item--active">recording</a>
      <a href="/runtime-status.html" class="topbar__nav-item">status</a>
    </nav>
  </div>

  <main class="page">

    <!-- Image preview -->
    <div class="cc" id="preview-card">
      <div class="cc__title">/psilia/image/preview</div>
      <div id="preview-placeholder">waiting for /psilia/image/preview/compressed…</div>
      <img id="preview-img" style="display:none;" />
    </div>

    <!-- Recording controls -->
    <div class="cc">
      <div class="cc__title">Recording</div>
      <div class="cc__field">
        <label class="input-label" for="session-input">session name</label>
        <input class="input" type="text" id="session-input" placeholder="e.g. crimson-falcon" />
      </div>
      <div style="margin-top: var(--space-md);">
        <button class="btn btn--start btn--gradient" id="record-btn" disabled onclick="toggleRecording()">start</button>
      </div>
    </div>

    <!-- Topics -->
    <div class="cc">
      <div class="cc__title">Topics</div>
      <ul class="topic-list" id="topic-list">
        <li id="topics-placeholder" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--color-idle);">waiting for rosbridge…</li>
      </ul>
    </div>

  </main>

  <script>
    document.getElementById('di-hostname').textContent = location.hostname;

    const ROSBRIDGE_URL = `ws://${location.hostname}:${window.PSILIA.rosbridgePort}`;

    // TODO: make topics configurable from runtime.yaml
    const DEFAULT_TOPICS = ['/psilia/heartbeat'];

    let isRecording = false;

    const ros = new ROSLIB.Ros({ url: ROSBRIDGE_URL });

    ros.on('connection', () => {
      document.getElementById('record-btn').disabled = false;
      ros.getTopics(({ topics }) => {
        const list = document.getElementById('topic-list');
        list.innerHTML = '';
        topics.sort((a, b) => {
          const ap = a.startsWith('/psilia/'), bp = b.startsWith('/psilia/');
          if (ap !== bp) return ap ? -1 : 1;
          return a.localeCompare(b);
        }).forEach(topic => {
          const li    = document.createElement('li');
          const id    = 'topic-' + topic.replace(/\//g, '-');
          const cb    = document.createElement('input');
          cb.type     = 'checkbox';
          cb.id       = id;
          cb.value    = topic;
          cb.checked  = DEFAULT_TOPICS.includes(topic);
          const label = document.createElement('label');
          label.htmlFor   = id;
          label.textContent = topic;
          li.append(cb, label);
          list.appendChild(li);
        });
      });
    });

    ros.on('error', () => {
      document.getElementById('record-btn').disabled = true;
    });

    ros.on('close', () => {
      document.getElementById('record-btn').disabled = true;
      setTimeout(() => ros.connect(ROSBRIDGE_URL), 3000);
    });

    // ── Heartbeat → di dot ────────────────────────────────────
    const diDot = document.getElementById('di-dot');
    new ROSLIB.Topic({ ros, name: '/psilia/heartbeat', messageType: 'std_msgs/String' })
      .subscribe(() => {
        diDot.classList.remove('beat');
        void diDot.offsetWidth;
        diDot.classList.add('beat');
      });

    // ── Image preview ─────────────────────────────────────────
    new ROSLIB.Topic({ ros, name: '/psilia/image/preview/compressed', messageType: 'sensor_msgs/CompressedImage' })
      .subscribe(msg => {
        const img = document.getElementById('preview-img');
        img.src = 'data:image/jpeg;base64,' + msg.data;
        img.style.display = 'block';
        document.getElementById('preview-placeholder').style.display = 'none';
      });

    // ── Recording status ──────────────────────────────────────
    new ROSLIB.Topic({ ros, name: '/psilia/recording/status', messageType: 'std_msgs/Bool' })
      .subscribe(msg => {
        isRecording = msg.data;
        const btn = document.getElementById('record-btn');
        btn.textContent = isRecording ? 'stop' : 'start';
        btn.className   = isRecording
          ? 'btn btn--stop btn--gradient'
          : 'btn btn--start btn--gradient';
      });

    // ── Recording publishers ──────────────────────────────────
    const startTopic = new ROSLIB.Topic({ ros, name: '/psilia/web/recording/start', messageType: 'std_msgs/String' });
    const stopTopic  = new ROSLIB.Topic({ ros, name: '/psilia/web/recording/stop',  messageType: 'std_msgs/String' });

    function getCheckedTopics() {
      return [...document.querySelectorAll('#topic-list input[type="checkbox"]:checked')]
        .map(cb => cb.value);
    }

    function toggleRecording() {
      if (isRecording) {
        stopTopic.publish(new ROSLIB.Message({ data: '' }));
      } else {
        const session = document.getElementById('session-input').value.trim() || 'session';
        const topics  = getCheckedTopics();
        startTopic.publish(new ROSLIB.Message({ data: JSON.stringify({ session, topics }) }));
      }
    }
  </script>
</body>
</html>
