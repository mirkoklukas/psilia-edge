<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psilia Edge — Debug</title>
  <script src="/vendor/roslib.min.js"></script>
  <script src="/api/js/config.js"></script>
  <script src="/psilia-theme.js"></script>
  <link rel="stylesheet" href="/psilia.css">
  <style>
    .preview img {
      width: 100%;
      border-radius: var(--radius-sm);
      display: block;
    }
    .preview .placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--color-bg);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-idle);
    }
    #ros-status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-idle);
      text-align: center;
      padding: var(--space-sm) 0;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar__brand-row">
      <div class="brand">
        <span class="brand__psilia">Psilia</span>
        <span class="brand__edge">Edge</span>
      </div>
      <div style="display:flex;align-items:center;gap:0.6rem;">
        <button class="theme-toggle" onclick="psiliaToggleTheme()">theme</button>
        <div class="di">
          <div class="di__dot"></div>
          <span id="di-hostname"></span>
        </div>
      </div>
    </div>
    <nav class="topbar__nav">
      <a href="/"               class="topbar__nav-item">home</a>
      <a href="/recording.html" class="topbar__nav-item">recording</a>
      <a href="/runtime-status.html" class="topbar__nav-item">status</a>
      <a href="/debug.html"     class="topbar__nav-item topbar__nav-item--active">debug</a>
    </nav>
  </div>

  <main class="page">
    <div id="ros-status">connecting to rosbridge...</div>

    <div class="cc preview">
      <div class="cc__title">/psilia/preview/image/compressed</div>
      <div class="placeholder" id="ph-image">waiting for data</div>
      <img id="img-image" style="display:none;">
    </div>

    <div class="cc preview">
      <div class="cc__title">/psilia/preview/rectified/compressed</div>
      <div class="placeholder" id="ph-rect">waiting for data</div>
      <img id="img-rect" style="display:none;">
    </div>

    <div class="cc preview">
      <div class="cc__title">/psilia/preview/depth/compressed</div>
      <div class="placeholder" id="ph-depth">waiting for data</div>
      <img id="img-depth" style="display:none;">
    </div>

    <div class="cc" id="fps-card">
      <div class="cc__title">Topic Hz</div>
      <div id="fps-rows"></div>
    </div>
  </main>

  <script>
    document.getElementById('di-hostname').textContent = location.hostname;

    const ROSBRIDGE_URL = `ws://${location.hostname}:${window.PSILIA.rosbridgePort}`;
    const ros = new ROSLIB.Ros({ url: ROSBRIDGE_URL });

    ros.on('connection', () => {
      document.getElementById('ros-status').textContent = '';
    });
    ros.on('error', () => {
      document.getElementById('ros-status').textContent = 'rosbridge error';
    });
    ros.on('close', () => {
      document.getElementById('ros-status').textContent = 'rosbridge disconnected';
      setTimeout(() => ros.connect(ROSBRIDGE_URL), 3000);
    });

    function subscribeCompressed(topic, imgId, phId) {
      const img = document.getElementById(imgId);
      const ph  = document.getElementById(phId);
      new ROSLIB.Topic({
        ros,
        name: topic,
        messageType: 'sensor_msgs/CompressedImage',
      }).subscribe(msg => {
        img.src = 'data:image/jpeg;base64,' + msg.data;
        img.style.display = 'block';
        ph.style.display = 'none';
      });
    }

    subscribeCompressed('/psilia/preview/image/compressed',      'img-image', 'ph-image');
    subscribeCompressed('/psilia/preview/rectified/compressed',  'img-rect',  'ph-rect');
    subscribeCompressed('/psilia/preview/depth/compressed',      'img-depth', 'ph-depth');

    // ── Topic Hz (from hz_node) ─────────────────────────────
    new ROSLIB.Topic({ ros, name: '/psilia/diagnostics/hz', messageType: 'std_msgs/String' })
      .subscribe(msg => {
        let data;
        try { data = JSON.parse(msg.data); } catch { return; }
        const container = document.getElementById('fps-rows');
        for (const [topic, info] of Object.entries(data)) {
          let row = document.getElementById('hz-' + topic);
          if (!row) {
            row = document.createElement('div');
            row.className = 'cc__row';
            row.id = 'hz-' + topic;
            const label = document.createElement('span');
            label.className = 'cc__label';
            label.textContent = topic;
            label.style.fontSize = '0.68rem';
            const value = document.createElement('span');
            value.className = 'cc__value';
            value.id = 'hz-val-' + topic;
            row.appendChild(label);
            row.appendChild(value);
            container.appendChild(row);
          }
          const el = document.getElementById('hz-val-' + topic);
          el.textContent = info.hz > 0 ? info.hz.toFixed(2) + ' Hz' : '—';
          el.style.color = info.hz > 0 ? 'var(--color-live)' : 'var(--color-idle)';
        }
      });
  </script>
</body>
</html>
