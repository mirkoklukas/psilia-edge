<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psilia Edge — Status</title>
  <script src="/vendor/roslib.min.js"></script>
  <script src="/api/js/config.js"></script>
  <link rel="stylesheet" href="/psilia.css">
  <style>
    #load-status {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-text-muted);
      align-self: flex-start;
    }
    .cc__value--dim { color: var(--color-idle); }
    .cc__list {
      padding: 0.3rem 0 0.1rem 0.75rem;
    }
    .cc__list-item {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-text);
      padding: 0.2rem 0;
    }
    .cc__row--list {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar__brand-row">
      <div class="brand">
        <span class="brand__psilia">Psilia</span>
        <span class="brand__edge">Edge</span>
      </div>
      <div class="di">
        <div class="di__dot" id="di-dot"></div>
        <span id="di-hostname"></span>
      </div>
    </div>
    <nav class="topbar__nav">
      <a href="/"                    class="topbar__nav-item">home</a>
      <a href="/recording.html"      class="topbar__nav-item">recording</a>
      <a href="/runtime-status.html" class="topbar__nav-item topbar__nav-item--active">status</a>
      <a href="/debug.html"          class="topbar__nav-item">debug</a>
    </nav>
  </div>

  <main class="page">

    <div id="load-status">loading…</div>
    <div id="cards" style="width:100%; display:flex; flex-direction:column; gap:var(--space-md);"></div>

  </main>

  <script>
    document.getElementById('di-hostname').textContent = location.hostname;

    // ── Heartbeat → di dot ────────────────────────────────────
    const diDot = document.getElementById('di-dot');
    const ros = new ROSLIB.Ros({ url: `ws://${location.hostname}:${window.PSILIA.rosbridgePort}` });
    ros.on('close', () =>
      setTimeout(() => ros.connect(`ws://${location.hostname}:${window.PSILIA.rosbridgePort}`), 3000));

    new ROSLIB.Topic({ ros, name: '/psilia/heartbeat', messageType: 'std_msgs/String' })
      .subscribe(() => {
        diDot.classList.remove('beat');
        void diDot.offsetWidth;
        diDot.classList.add('beat');
      });

    // ── Status load ───────────────────────────────────────────
    async function load() {
      const loadEl = document.getElementById('load-status');
      const cards  = document.getElementById('cards');
      loadEl.textContent = 'loading…';
      cards.innerHTML = '';

      const t0  = Date.now();
      const res = await fetch('/api/status');
      if (!res.ok) { loadEl.textContent = 'failed to load status'; return; }

      const status = await res.json();
      loadEl.textContent = `loaded in ${Date.now() - t0}ms`;
      for (const [section, value] of Object.entries(status)) {
        cards.appendChild(buildCard(section, value));
      }
    }

    function buildCard(title, value) {
      const card = document.createElement('div');
      card.className = 'cc';
      const heading = document.createElement('div');
      heading.className = 'cc__title';
      heading.textContent = title;
      card.appendChild(heading);
      card.appendChild(renderValue(value, ''));
      return card;
    }

    function renderValue(value, prefix) {
      const frag = document.createDocumentFragment();

      if (Array.isArray(value)) {
        const row = document.createElement('div');
        row.className = 'cc__row cc__row--list';
        if (prefix) {
          const label = document.createElement('span');
          label.className = 'cc__label';
          label.textContent = prefix;
          row.appendChild(label);
        }
        const list = document.createElement('div');
        list.className = 'cc__list';
        if (value.length) {
          value.forEach(item => {
            const el = document.createElement('div');
            el.className = 'cc__list-item';
            el.textContent = item;
            list.appendChild(el);
          });
        } else {
          const empty = document.createElement('div');
          empty.className = 'cc__list-item cc__value--dim';
          empty.textContent = '—';
          list.appendChild(empty);
        }
        row.appendChild(list);
        frag.appendChild(row);

      } else if (value && typeof value === 'object') {
        for (const [k, v] of Object.entries(value)) {
          const label = prefix ? `${prefix}.${k}` : k;
          frag.appendChild(renderValue(v, label));
        }

      } else {
        const row = document.createElement('div');
        row.className = 'cc__row';
        const label = document.createElement('span');
        label.className = 'cc__label';
        label.textContent = prefix;
        const val = document.createElement('span');
        val.className = value == null ? 'cc__value cc__value--dim' : 'cc__value';
        val.textContent = value ?? '—';
        row.appendChild(label);
        row.appendChild(val);
        frag.appendChild(row);
      }

      return frag;
    }

    load();
  </script>
</body>
</html>
