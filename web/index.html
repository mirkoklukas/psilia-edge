<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psilia Edge</title>
  <script src="/vendor/roslib.min.js"></script>
  <script src="/api/js/config.js"></script>
  <link rel="stylesheet" href="/psilia.css">
  <style>
    /* ── Heartbeat circle ────────────────────────────────────── */
    #hb-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-green);
      transform: scale(0.8);
      opacity: 0.3;
      margin: 0.25rem auto 0.5rem;
    }
    #hb-circle.beat { animation: hb-pulse 3s ease-out forwards; }
    @keyframes hb-pulse {
      0%   { transform: scale(0.9); opacity: 0.3; }
      3%   { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.3; }
    }

    /* ── Preflight check animations ──────────────────────────── */
    @keyframes check-glow-green {
      0%   { background: transparent; }
      20%  { background: rgba(78,204,163,0.06); }
      100% { background: transparent; }
    }
    @keyframes check-glow-red {
      0%   { background: transparent; }
      20%  { background: rgba(224,85,85,0.06); }
      100% { background: transparent; }
    }
    @keyframes check-shake {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-1.5px); }
      40%  { transform: translateX(1.5px); }
      60%  { transform: translateX(-0.5px); }
      80%  { transform: translateX(0.5px); }
      100% { transform: translateX(0); }
    }
    @keyframes check-text-glow {
      0%   { text-shadow: none; }
      20%  { text-shadow: 0 0 8px currentColor; }
      100% { text-shadow: none; }
    }
    .check-glow-green { animation: check-glow-green 0.6s ease-out forwards; }
    .check-glow-red   { animation: check-glow-red   0.6s ease-out forwards; }
    .check-shake      { animation: check-shake 0.4s ease-out forwards, check-glow-red 0.6s ease-out forwards; }
    .check-text-glow  { animation: check-text-glow 0.6s ease-out forwards; }

    /* ── Preflight: force-bypass dimming ─────────────────────── */
    #preflight.bypassed { opacity: 0.4; }
    #preflight.bypassed .tg { opacity: calc(1 / 0.4); }

    /* ── Preflight header row ────────────────────────────────── */
    .cc__header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.1rem;
    }
    .cc__header-row .cc__title { margin-bottom: 0; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar__brand-row">
      <div class="brand">
        <span class="brand__psilia">Psilia</span>
        <span class="brand__edge">Edge</span>
      </div>
      <div class="di">
        <div class="di__dot"></div>
        <span id="di-hostname"></span>
      </div>
    </div>
    <nav class="topbar__nav">
      <a href="/"               class="topbar__nav-item topbar__nav-item--active">home</a>
      <a href="/recording.html" class="topbar__nav-item">recording</a>
      <a href="/runtime-status.html" class="topbar__nav-item">status</a>
    </nav>
  </div>

  <main class="page">

    <!-- Heartbeat -->
    <div class="cc" style="padding: var(--space-lg);">
      <div class="cc__title">/psilia/heartbeat</div>
      <div id="hb-circle" style="margin: 0.25rem auto 0.5rem;"></div>
    </div>

    <!-- Preflight Checks -->
    <div class="cc" id="preflight">
      <div class="cc__header-row">
        <div class="cc__title">Preflight Checks</div>
        <label class="tg" title="Bypass preflight checks">
          <input type="checkbox" id="force-toggle" checked>
          <span class="tg__track"></span>
        </label>
      </div>
      <div id="preflight-rows"></div>
    </div>

    <!-- Spatial toggle -->
    <div class="cc" style="padding: var(--space-md) var(--space-lg);">
      <button class="btn btn--start btn--gradient" id="btn-toggle" onclick="spatialToggle()">start</button>
    </div>

    <!-- Recording link -->
    <a href="/recording.html" class="cl">
      <div class="cl__body">
        <div class="cl__title-row">
          <span class="cl__title">Recording</span>
          <svg class="cl__arrow" width="14" height="14" viewBox="0 0 12 12" fill="none">
            <polyline points="4,2 8,6 4,10" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="cl__subtitle">start / stop · name sessions · pick topics</div>
      </div>
    </a>

  </main>

  <script>
    // ── Device hostname ───────────────────────────────────────
    document.getElementById('di-hostname').textContent = location.hostname;

    // ── Render state from SSE ─────────────────────────────────
    function render(s) {
      const spatial = s.spatial_running || {};
      const reqs    = s.spatial_requirements || {};

      // Spatial button
      spatialRunning = !!spatial.running;
      const btn = document.getElementById('btn-toggle');
      btn.textContent = spatialRunning ? 'stop' : 'start';
      btn.className   = spatialRunning
        ? 'btn btn--stop btn--gradient'
        : 'btn btn--start btn--gradient';
      btn.disabled = false;

      // Preflight checks (flat dict with dotted keys)
      for (const [key, val] of Object.entries(reqs)) {
        setCheck(key, !!val?.ok);
      }
    }

    function ensureRow(key) {
      let row = document.getElementById(`row-${key}`);
      if (row) return row;
      const container = document.getElementById('preflight-rows');
      row = document.createElement('div');
      row.className = 'cc__row';
      row.id = `row-${key}`;
      const label = document.createElement('span');
      label.className = 'cc__label';
      label.textContent = key;
      const check = document.createElement('span');
      check.className = 'cc__check--fail';
      check.id = `req-${key}`;
      check.textContent = '—';
      row.appendChild(label);
      row.appendChild(check);
      container.appendChild(row);
      return row;
    }

    function setCheck(key, ok) {
      const row = ensureRow(key);
      const el  = document.getElementById(`req-${key}`);
      const symbol = ok ? '✓' : '✗';
      const changed = el.textContent !== symbol;
      el.textContent = symbol;
      el.className   = ok ? 'cc__check--ok' : 'cc__check--fail';
      if (changed) {
        el.classList.remove('check-text-glow');
        void el.offsetWidth;
        el.classList.add('check-text-glow');
        row.classList.remove('check-glow-green', 'check-glow-red');
        void row.offsetWidth;
        row.classList.add(ok ? 'check-glow-green' : 'check-glow-red');
      }
    }

    // ── Spatial toggle ────────────────────────────────────────
    let spatialRunning = false;

    async function spatialToggle() {
      document.getElementById('btn-toggle').disabled = true;
      const force  = !document.getElementById('force-toggle').checked;
      const base   = spatialRunning ? '/api/spatial/stop' : '/api/spatial/start';
      const url    = (!spatialRunning && force) ? `${base}?force=true` : base;
      const res    = await fetch(url, { method: 'POST' });

      if (res.status === 412) {
        const data = await res.json();
        for (const [key, val] of Object.entries(data.checks || {})) {
          if (!val.ok) {
            const row = document.getElementById(`row-${key}`);
            if (row) {
              row.classList.remove('check-shake', 'check-glow-red', 'check-glow-green');
              void row.offsetWidth;
              row.classList.add('check-shake');
            }
          }
        }
        document.getElementById('btn-toggle').disabled = false;
      }
    }

    // ── Force toggle (bypass preflight) ──────────────────────
    const forceToggle  = document.getElementById('force-toggle');
    const preflightEl  = document.getElementById('preflight');
    forceToggle.addEventListener('change', () => {
      preflightEl.classList.toggle('bypassed', !forceToggle.checked);
    });

    // ── Heartbeat (rosbridge) ─────────────────────────────────
    const circle = document.getElementById('hb-circle');
    const diDot  = document.querySelector('.di__dot');
    const ros = new ROSLIB.Ros({ url: `ws://${location.hostname}:${window.PSILIA.rosbridgePort}` });
    ros.on('close', () =>
      setTimeout(() => ros.connect(`ws://${location.hostname}:${window.PSILIA.rosbridgePort}`), 3000));

    new ROSLIB.Topic({ ros, name: '/psilia/heartbeat', messageType: 'std_msgs/String' })
      .subscribe(() => {
        circle.classList.remove('beat');
        void circle.offsetWidth;
        circle.classList.add('beat');

        diDot.classList.remove('beat');
        void diDot.offsetWidth;
        diDot.classList.add('beat');
      });

    // ── SSE ───────────────────────────────────────────────────
    const es = new EventSource('/api/events');
    es.onmessage = e => render(JSON.parse(e.data));
  </script>
</body>
</html>
