<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psilia Edge — Runtime Test</title>

  <!-- TODO: roslibjs loaded from CDN. In the field there may be no internet access.
             Consider vendoring roslib.min.js into web/vendor/ and updating this path. -->
  <script src="/vendor/roslib.min.js"></script>
  <script src="/api/js/config.js"></script>

  <link rel="stylesheet" href="/psilia.css">
  <style>
    #ros-status { font-size: 0.75rem; color: #555; margin-bottom: 1.25rem; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    button:active { opacity: 0.8; }
    #ping-log {
      font-family: monospace;
      font-size: 0.78rem;
      color: #555;
      margin-top: 0.75rem;
    }
    #ping-log .entry { padding: 0.2rem 0; border-bottom: 1px solid #1a1a2e; }
    #ping-log .entry:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <h1>Psilia Edge</h1>
  <div class="subtitle">spatial perception runtime</div>
  <nav>
    <a href="/">status</a>
    <a href="/runtime-status.html">runtime status</a>
    <a href="/runtime-test.html" class="active">runtime test</a>
    <a href="/recording.html">recording</a>
    <a href="/config.html">config</a>
  </nav>
  <div id="ros-status">connecting to rosbridge…</div>

  <div class="card">
    <h2>/psilia/status</h2>
    <div class="row">
      <span class="label">status</span>
      <span class="value dim" id="hb-status">—</span>
    </div>
    <div class="row">
      <span class="label">stamp</span>
      <span class="value dim" id="hb-stamp">—</span>
    </div>
    <div class="row">
      <span class="label">last received</span>
      <span class="value dim" id="hb-received">—</span>
    </div>
  </div>

  <div class="card">
    <h2>/psilia/ping — /psilia/pong</h2>
    <button id="ping-btn" onclick="sendPing()">Send Ping</button>
    <div id="ping-log"></div>
  </div>

  <script>
    const ROSBRIDGE_URL = `ws://${location.hostname}:${window.PSILIA.rosbridgePort}`;

    const ros = new ROSLIB.Ros({ url: ROSBRIDGE_URL });

    ros.on('connection', () => {
      document.getElementById('ros-status').textContent = '';
      document.getElementById('ros-status').className = '';
    });

    ros.on('error', () => {
      document.getElementById('ros-status').textContent = 'rosbridge error';
      document.getElementById('ros-status').style.color = '#f0c040';
    });

    ros.on('close', () => {
      document.getElementById('ros-status').textContent = 'rosbridge disconnected';
      document.getElementById('ros-status').style.color = '#555';
    });

    // --- /psilia/status subscriber ---
    const statusTopic = new ROSLIB.Topic({
      ros,
      name: '/psilia/status',
      messageType: 'std_msgs/String',
    });

    statusTopic.subscribe(msg => {
      let data;
      try { data = JSON.parse(msg.data); } catch { return; }
      document.getElementById('hb-status').textContent  = data.status ?? '—';
      document.getElementById('hb-status').className    = 'value ' + (data.status === 'ok' ? 'green' : 'yellow');
      document.getElementById('hb-stamp').textContent   = data.stamp ?? '—';
      document.getElementById('hb-received').textContent = new Date().toLocaleTimeString();
      document.getElementById('hb-received').className  = 'value green';
    });

    // --- /psilia/ping publisher ---
    const pingTopic = new ROSLIB.Topic({
      ros,
      name: '/psilia/ping',
      messageType: 'std_msgs/String',
    });

    // --- /psilia/pong subscriber ---
    const pongTopic = new ROSLIB.Topic({
      ros,
      name: '/psilia/pong',
      messageType: 'std_msgs/String',
    });

    function logMessage(msg) {
      const log = document.getElementById('ping-log');
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.textContent = `${new Date().toLocaleTimeString()}  ${msg.data}`;
      log.prepend(entry);
      if (log.children.length > 10) log.lastChild.remove();
    }

    // pingTopic.subscribe(logMessage);
    pongTopic.subscribe(logMessage);

    function nowNs() {
      return BigInt(Date.now()) * 1_000_000n;
    }

    function sendPing() {
      const payload = JSON.stringify({ message: 'ping', timestamp: nowNs().toString() });
      pingTopic.publish(new ROSLIB.Message({ data: payload }));
    }
  </script>
</body>
</html>
