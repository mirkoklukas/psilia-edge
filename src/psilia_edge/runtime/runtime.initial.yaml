name: My Runtime Config
# docker:
#   profile: jetson          # laptop | jetson | isaac (default: auto-detected by platform)
#   # image: my/custom:tag   # optional — overrides the profile's default image
ros:
    launch: default.launch.py
    nodes:
        rectify_node:
            enable: false
        depth_node:
            enable: false
        camera_node:
            enable: true
            # parameters:
            #     device: /dev/video0
            #     pixel_format: MJPG
            #     width: 2560
            #     height: 720
            #     fps: 30
        preview_node:
            enable: true
            parameters:
                target_height: 1000
                fps: 5
        depth_cuda_node:
            enable: true
            parameters:
                num_disparities: 128
                p1: 20
                p2: 120
                uniqueness_ratio: 10
                publish_rectified: false
        # cuda_stereo_bm_node:
        #     enable: true
        #     parameters:
        #         num_disparities: 128
        #         block_size: 19
        #         publish_rectified: false
        depth_preview_node:
            enable: true
            parameters:
                target_height: 1000
                max_depth: 3.0
                fps: 5
        pointcloud_preview_node:
            enable: false
            parameters:
                fps: 2
                num_samples: 10000
        diagnostics_node:
            enable: true
            # parameters:
            #     hz_topics:
            #         - /psilia/heartbeat, std_msgs/msg/String
            #         - /psilia/stereo/raw/image, sensor_msgs/msg/Image
            #         - /psilia/stereo/rect/image, sensor_msgs/msg/Image
            #         - /psilia/stereo/depth/image, sensor_msgs/msg/Image
            #         - /psilia/preview/image/compressed, sensor_msgs/msg/CompressedImage
            #         - /psilia/preview/depth/compressed, sensor_msgs/msg/CompressedImage
            #         - /psilia/preview/rectified/compressed, sensor_msgs/msg/CompressedImage
    recording:
        topics:
            - /psilia/interface
            - /psilia/heartbeat
            - /psilia/stereo/raw/image
            - /psilia/stereo/raw/left/camera_info
            - /psilia/stereo/raw/right/camera_info
            - /psilia/stereo/rect/image
            - /psilia/stereo/rect/left/camera_info
            - /psilia/stereo/rect/right/camera_info
    foxglove:
        enabled: true
        topics:
            - /psilia/preview/image/compressed
            - /psilia/preview/depth/compressed
            - /psilia/preview/pointcloud
            - /tf_static
