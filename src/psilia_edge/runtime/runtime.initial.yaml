name: My Runtime Config
ros:
  launch: default.launch.py
  nodes:
    rectify_node:
      enable: false
    depth_node:
      enable: false
    # camera_node:
    #   parameters:
    #     device: /dev/video0
    #     pixel_format: MJPG
    #     width: 2560
    #     height: 720
    #     fps: 30
    preview_node:
      enable: true
      parameters:
        target_height: 50
        fps: 5
    depth_cuda_node:
      enable: true
      parameters:
        num_disparities: 128
        p1: 200
        p2: 800
        uniqueness_ratio: 10
        publish_rectified: true
    depth_preview_node:
      enable: true
      parameters:
        target_height: 1000
        max_depth: 3.0
        fps: 5
    pointcloud_preview_node:
      parameters:
        fps: 2
        num_samples: 10000
  recording:
    topics:
      - /psilia/interface
      - /psilia/heartbeat
  foxglove:
    enabled: true
    topics:
      - /psilia/preview/image/compressed
      - /psilia/preview/depth/compressed
      - /psilia/preview/rectified/compressed
      - /psilia/preview/pointcloud
