[project]
name = "psilia-edge"
version = "0.1.0-alpha.1"
description = "Spatial perception runtime for edge devices"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "textual",
    "numpy",
    "paramiko",
    "psutil",
    "pyyaml",
    "sshconf",
    "fastapi",
    "uvicorn[standard]",
    "opencv-python-headless",
]

[project.optional-dependencies]
# Numerical core (off-device): SE(3)/transform math. Not installed on edge.
core-jax = [
    "jax",
    "jaxlie",
]

[project.scripts]
psilia = "psilia.cli:app"
rt = "psilia.edge.runtime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psilia"]

[dependency-groups]
dev = [
    "pytest",
    "mcap_ros2",
    "pandas",
]
