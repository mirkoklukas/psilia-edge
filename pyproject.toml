[project]
name = "psilia-edge"
version = "0.0.1"
description = "Spatial perception runtime for edge devices"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "numpy",
    "mcap",
    "paramiko",
]

[project.optional-dependencies]
jetson = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
psilia = "psilia_edge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psilia_edge"]

[dependency-groups]
dev = [
    "pytest",
]
