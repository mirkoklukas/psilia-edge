[project]
name = "psilia-edge"
version = "0.1.0-alpha.1"
description = "Spatial perception runtime for edge devices"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "textual",
    "numpy",
    "paramiko",
    "psutil",
    "pyyaml",
    "sshconf",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
psilia = "psilia_edge.cli:app"
rt = "psilia_edge.runtime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psilia_edge", "src/psilia_core"]

[dependency-groups]
dev = [
    "pytest",
    "mcap_ros2",
    "pandas",
]
